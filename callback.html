<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyan Panda — Mã đăng nhập</title>
<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#eefbfd;color:#123;margin:0;padding:24px}
  .card{max-width:520px;margin:6vh auto;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 8px 30px rgba(0,60,80,.12)}
  h1{font-size:22px;margin:0 0 6px}
  p{line-height:1.55;color:#345}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;word-break:break-all;background:#f2f7f8;border:1px dashed #7cc7d4;border-radius:12px;padding:14px;margin:16px 0;user-select:all}
  button{background:#06b6d4;color:#fff;border:0;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:600;width:100%}
  button:active{transform:scale(.98)}
  .ok{color:#0a7d4f;font-weight:600}
  .err{color:#b3261e;font-weight:600}
  .small{font-size:13px;color:#678}
</style>
</head>
<body>
<div class="card">
  <h1>🐼 Cyan Panda — mã đăng nhập của bạn</h1>
  <div id="main"></div>
  <p class="small">Trang này chỉ HIỂN THỊ mã ngay trên máy của bạn — mã không được gửi đi đâu khác. Mã có hạn dùng rất ngắn, hãy dán vào app ngay.</p>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var code = q.get('code');
  var err = q.get('error') || q.get('error_description');
  var main = document.getElementById('main');
  if (err) {
    main.innerHTML = '<p class="err">TikTok báo lỗi: ' + String(err).replace(/</g,'&lt;') + '</p>' +
      '<p>Hãy quay lại app và thử đăng nhập lại. Nếu vẫn lỗi, chụp màn hình này gửi cho Gà Con nhé.</p>';
    return;
  }
  if (!code) {
    main.innerHTML = '<p class="err">Không thấy mã trong địa chỉ trang.</p>' +
      '<p>Hãy quay lại app và bấm đăng nhập lại từ đầu.</p>';
    return;
  }
  main.innerHTML =
    '<p class="ok">✅ TikTok đã duyệt! Làm theo 2 bước:</p>' +
    '<p><b>Bước 1:</b> bấm nút dưới để sao chép mã.<br><b>Bước 2:</b> quay lại app Cyan Panda (Expo Go), dán mã vào ô <b>“Dán code hoặc link callback”</b> rồi bấm <b>Xác nhận code</b>.</p>' +
    '<div class="code" id="codebox"></div>' +
    '<button id="copybtn" type="button">📋 Sao chép mã</button>' +
    '<p id="copied" class="ok" style="display:none">Đã sao chép! Quay lại app và dán vào ô mã nhé.</p>';
  document.getElementById('codebox').textContent = code;
  document.getElementById('copybtn').addEventListener('click', function(){
    function done(){ document.getElementById('copied').style.display='block'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var r = document.createRange();
      r.selectNodeContents(document.getElementById('codebox'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); } catch(e) {}
      done();
    }
  });
})();
</script>
</body>
</html>
